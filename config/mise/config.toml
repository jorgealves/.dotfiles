# "brew-cask:granola" ="latest"
# "brew:synergy-core" = "latest"
# "brew-cask:raspbery-pi-imager" = "latest"

[dotfiles]
"~/.config/mise" = { source = "~/projects/.dotfiles/config/mise", mode = "symlink" }
"~/.ssh" = { source = "~/projects/.dotfiles/config/.ssh", mode = "symlink" }
"~/.config/git" = { source = "~/projects/.dotfiles/config/git", mode = "symlink" }
"~/.gitconfig*" = { source = "~/projects/.dotfiles/config/.gitconfig*", mode = "symlink" }
"~/.zshenv" = { source = "~/projects/.dotfiles/config/zsh/.zshenv", mode = "symlink" }
"~/.config/zsh" = { source = "~/projects/.dotfiles/config/zsh", mode = "symlink" }
"~/Library/Application Support/Code/User/*.json" = { source = "~/projects/.dotfiles/vscode/*.json", mode = "symlink" }
"~/.config/opencode" = { source = "~/projects/.dotfiles/config/opencode", mode = "symlink" }
"~/.config/starship.toml" = { source = "~/projects/.dotfiles/config/starship.toml", mode = "symlink" }
"~/.config/nvim" = { source = "~/projects/.dotfiles/config/nvim", mode = "symlink" }
"~/.tmux.conf" = { source = "~/projects/.dotfiles/config/.tmux.conf", mode = "symlink" }

[tools]
# Programming languages
python = ["3.12","3.13","3.14"]
node = ["22", "lts"]
go = "latest"
rust = "latest"
# Python
uv = { version = "latest", depends = [
  "python",
] } # Universal virtual environment manager
poetry = { version = "latest", depends = [
  "python",
] } # Python dependency management and packaging

[shell_alias]
# file management
l = 'eza'
ll = 'eza -lA -F always --icons=always -s type'
la = 'll'
tree = 'l --tree'
'..' = 'cd ..'
'...' = 'cd ../..'
'....' = 'cd ../../..'

# git
g = 'git'
gs = 'git status'
gp = 'git pull'
gfa = 'git fetch --all --prune --verbose'
gc = 'git commit'
gca = 'git commit -a'
gco = 'git checkout'
gb = 'git branch'
gd = 'git diff'
gl = 'git log --oneline --graph --decorate'
gla = 'git log --oneline --graph --decorate --all'

# uv
py = 'uv run python'
pytest = 'uv run pytest'
uvr = 'uv run'
uvsync = 'uv sync'
uvlock = 'uv lock'

# kubernetes
k = 'kubectl'

# misc
cat = 'bat'
grep = 'rg'
find = 'fd'


[tasks.docker-sysclean]
description = "Clean up Docker system"
run = "docker system prune -af --volumes"
